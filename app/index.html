<title>D2R 스킬 사전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 홈(클래스 선택+검색) → 클래스(트리 탭+그리드) → 스킬 상세. 다크 단일 테마(디아블로 월드). */
:root{
  --bg:#0c0907; --surface:#191210; --surface-2:#23191362; --raised:#241a13;
  --border:#3b2d1e; --border-soft:#2a2016;
  --text:#e9dec6; --muted:#a08c6c; --faint:#6d5c44;
  --gold:#d4af5e; --gold-dim:#8a7239; --ember:#a33b2e;
  --fire:#e07840; --cold:#6fb3e0; --ltng:#e8d36b; --pois:#8fc46a; --mag:#c58ae0; --phys:#c9b08a;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{
  color:var(--text); margin:0;
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.en{font-family:Cinzel,Georgia,serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:inherit;
  touch-action:manipulation;-webkit-user-select:none;user-select:none} /* 연타 시 iOS 더블탭 줌·텍스트 선택 방지 */
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
img{max-width:100%}

.hdr{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:.5rem;
  background:linear-gradient(#1b130e,#151009); border-bottom:1px solid var(--border);
  padding:.55rem .75rem;
}
.hdr .back{
  flex:none; width:2.4rem; height:2.4rem; display:grid; place-items:center;
  color:var(--gold); font-size:1.5rem; line-height:1; border-radius:8px;
}
.hdr .back[hidden]{display:none!important}
.hdr-title{min-width:0; flex:1}
.hdr-title .t1{font-weight:700; font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hdr-title .t2{color:var(--muted); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase}
.wrap{max-width:720px; margin:0 auto; padding:1rem 1rem calc(env(safe-area-inset-bottom,0px) + 2.5rem)}

/* ─ 홈 ─ */
.search{
  width:100%; box-sizing:border-box; font-size:1rem; color:var(--text);
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:.7rem .9rem;
}
.search::placeholder{color:var(--faint)}
.home-note{color:var(--faint); font-size:.8rem; margin:.5rem 0 1rem}
.class-grid{display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.4rem}
.class-card{
  display:flex; align-items:center; gap:.7rem;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:.7rem .8rem; min-height:3.2rem;
}
.class-card:active{background:var(--raised)}
.sicon{display:inline-block; flex:none; background-size:600% 500%; background-repeat:no-repeat;
  border-radius:8px; border:1px solid var(--border-soft); background-color:#0a0705}
.class-card .sicon{width:2.6rem; height:2.6rem}
.class-card .nm{font-weight:700}
.class-card .en{display:block; color:var(--muted); font-size:.7rem; letter-spacing:.06em}
.sec-label{
  color:var(--gold); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
  margin:1.4rem 0 .5rem; font-family:Cinzel,Georgia,serif; font-weight:700;
}
.sec-label:first-child{margin-top:.2rem}

/* ─ 검색 결과/스킬 행 ─ */
.rows{display:grid; gap:.45rem; margin:0; padding:0; list-style:none}
.row{
  display:flex; align-items:center; gap:.65rem; width:100%; box-sizing:border-box;
  background:var(--surface); border:1px solid var(--border-soft); border-radius:10px;
  padding:.5rem .65rem;
}
.row:active{border-color:var(--gold-dim)}
.row img{flex:none; width:2.4rem; height:2.4rem; border-radius:6px}
.row .sicon{width:2.4rem; height:2.4rem; border-radius:6px}
.row .b{min-width:0; flex:1}
.row .nm{font-weight:500}
.row .sub{color:var(--muted); font-size:.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .lv{flex:none; color:var(--faint); font-size:.75rem}
.empty{color:var(--muted); text-align:center; padding:2.2rem 0}

/* ─ 클래스: 트리 탭 ─ */
.tabs{display:flex; gap:.35rem; margin:.2rem 0 .9rem}
.tab{
  flex:1; text-align:center; padding:.5rem .3rem; font-size:.85rem; font-weight:500;
  color:var(--muted); background:var(--surface); border:1px solid var(--border-soft); border-radius:9px;
}
.tab.on{color:var(--text); border-color:var(--gold-dim); background:var(--raised); box-shadow:inset 0 0 0 1px #d4af5e22}
.tree-note{color:var(--faint); font-size:.75rem; text-align:center; margin:.6rem 0 0}

/* ─ 스킬 트리 그리드 (3열 × 6행, 인게임 배치) ─ */
.tree{
  position:relative; border:1px solid var(--border); border-radius:14px;
  background:radial-gradient(120% 90% at 50% 0%, #1d140d 0%, #120d08 70%);
  padding:.9rem .5rem 1.1rem;
}
.tree svg.links{position:absolute; inset:.9rem .5rem 1.1rem; width:calc(100% - 1rem); height:calc(100% - 2rem); pointer-events:none}
.tree svg.links line{stroke:#d4af5e55; stroke-width:2}
.tree-grid{position:relative; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(6,1fr); gap:0}
.node{
  grid-column:var(--c); grid-row:var(--r);
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.45rem .15rem; min-width:0; border-radius:10px;
}
.node:active{background:#d4af5e14}
.node .sicon{width:3.1rem; height:3.1rem; border:1px solid var(--border); box-shadow:0 2px 6px #0009}
.node .nm{font-size:.72rem; line-height:1.25; text-align:center; color:var(--text); text-wrap:balance}
.node .rq{font-size:.66rem; color:var(--faint)}
@media (max-width:420px){ .node .sicon{width:2.7rem;height:2.7rem} .node .nm{font-size:.68rem} }

/* ─ 상세 ─ */
.d-head{display:flex; align-items:center; gap:.9rem; margin:.3rem 0 1rem}
.d-head .sicon{width:4.4rem; height:4.4rem; border-radius:12px; border:1px solid var(--border); box-shadow:0 3px 10px #000b}
.d-head h1{margin:0; font-size:1.35rem; line-height:1.3}
.d-head .en{color:var(--muted); font-size:.85rem}
.badges{display:flex; flex-wrap:wrap; gap:.4rem; margin:.8rem 0}
.badge{
  font-size:.76rem; padding:.18rem .55rem; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--muted);
}
.badge b{color:var(--text); font-weight:500}
.badge.elem-fire b{color:var(--fire)} .badge.elem-cold b{color:var(--cold)}
.badge.elem-ltng b{color:var(--ltng)} .badge.elem-pois b{color:var(--pois)}
.badge.elem-mag b{color:var(--mag)} .badge.elem-phys b{color:var(--phys)}
.desc{margin:.9rem 0; padding:.8rem .9rem; background:var(--surface); border:1px solid var(--border-soft); border-radius:10px}
.desc .ko{margin:0}
.desc .en{display:block; color:var(--faint); font-size:.8rem; margin-top:.5rem; font-family:inherit; font-style:italic}
.chips{display:flex; flex-wrap:wrap; gap:.45rem; margin:.4rem 0 0; padding:0; list-style:none}
.chip{
  display:flex; align-items:center; gap:.45rem;
  background:var(--surface); border:1px solid var(--border-soft); border-radius:999px;
  padding:.28rem .75rem .28rem .3rem; font-size:.85rem;
}
.chip .sicon{width:1.7rem; height:1.7rem; border-radius:50%}
.chip:active{border-color:var(--gold-dim)}
.chip.plain{padding:.28rem .75rem; color:var(--muted)}
.chips-bar{display:flex; gap:.4rem; overflow-x:auto; padding:.5rem 0 .2rem; margin:0 -1rem; padding-left:1rem; padding-right:1rem; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips-bar::-webkit-scrollbar{display:none}
.chips-bar .chip{flex:none; white-space:nowrap; font-size:.82rem}
.chips-bar .chip.on{color:var(--text); border-color:var(--gold-dim); background:var(--raised); box-shadow:inset 0 0 0 1px #d4af5e22}
.d-sec{margin:1.3rem 0}
.d-sec h2{
  margin:0 0 .45rem; font-size:.82rem; color:var(--gold); font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; font-family:Cinzel,Georgia,serif;
}
.d-sec .hint{color:var(--faint); font-size:.78rem; margin:.35rem 0 0}

/* ─ 유니크 아이템 ─ */
.kind-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6rem; margin-top:.4rem}
.kind-card{
  display:flex; flex-direction:column; align-items:center; gap:.15rem; text-align:center;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:.8rem .4rem;
}
.kind-card:active{background:var(--raised)}
.kind-card .nm{font-weight:700; color:var(--gold)}
.kind-card .cnt{color:var(--faint); font-size:.75rem}
.cat-head{
  color:var(--gold); font-size:.8rem; font-weight:700; letter-spacing:.1em;
  margin:1.3rem 0 .5rem; padding-bottom:.25rem; border-bottom:1px solid var(--border-soft);
}
.cat-head:first-child{margin-top:.2rem}
.row .thumb-i{flex:none; width:2.6rem; height:3.2rem; display:grid; place-items:center}
.row .thumb-i img{max-width:2.6rem; max-height:3.2rem; width:auto; height:auto}
.tier{font-size:.68rem; padding:.05rem .4rem; border-radius:5px; border:1px solid var(--border-soft); color:var(--faint); white-space:nowrap}
.tier.elite{color:var(--gold); border-color:var(--gold-dim)}
.tier.exceptional{color:var(--text)}
.i-head{display:flex; align-items:center; gap:1rem; margin:.3rem 0 .8rem}
.i-head .pic{flex:none; width:5.2rem; height:6.4rem; display:grid; place-items:center;
  background:radial-gradient(80% 80% at 50% 40%, #241a12 0%, #140e09 100%);
  border:1px solid var(--border); border-radius:12px}
.i-head .pic img{max-width:4.6rem; max-height:5.8rem; width:auto; height:auto}
.i-head h1{margin:0; font-size:1.3rem; line-height:1.3; color:var(--gold)}
.i-head .base{color:var(--muted); font-size:.9rem}
.i-head .en{color:var(--faint); font-size:.8rem; display:block}
.props{margin:.9rem 0; padding:.85rem 1rem; background:var(--surface);
  border:1px solid var(--border-soft); border-radius:10px; list-style:none}
.props li{color:#7f9ddb; padding:.14rem 0; font-size:.94rem}
.props li.req{color:var(--muted); font-size:.85rem}
.props li.base-stat{color:var(--text)}

/* ─ 부적 접사 표 ─ */
details.cat{border:1px solid var(--border-soft); border-radius:10px; background:var(--surface); margin-bottom:.45rem}
details.cat summary{cursor:pointer; padding:.6rem .8rem; font-weight:600; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.cat summary::after{content:"▾"; color:var(--faint); transition:transform .15s}
details.cat[open] summary::after{transform:rotate(180deg)}
details.cat summary .cnt{color:var(--faint); font-size:.78rem; font-weight:400}
.affix-row{border-top:1px solid var(--border-soft); padding:.5rem .8rem}
.affix-row .nm{font-weight:500}
.affix-row .nm .en{color:var(--faint); font-size:.74rem}
.affix-row .mods{color:#7f9ddb; font-size:.9rem; margin:.1rem 0}
.affix-row .cond{color:var(--faint); font-size:.74rem}
.recipe-row{border:1px solid var(--border-soft); background:var(--surface); border-radius:10px; padding:.5rem .75rem; margin-bottom:.4rem}
.recipe-row .rin{font-size:.9rem; line-height:1.45}
.recipe-row .op{color:var(--faint); margin:0 .1rem}
.recipe-row .rout{color:var(--gold); font-size:.9rem; margin-top:.15rem}
.recipe-row .rmods{display:block; color:#7f9ddb; font-size:.82rem; margin-top:.1rem}
.recipe-row .cond{color:var(--faint); font-size:.74rem; margin-top:.2rem}
.toggle{display:flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.82rem; margin:.3rem 0 .6rem}
.toggle input{accent-color:var(--gold)}
.lv-bar{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem .8rem; margin:.3rem 0 .5rem}
.lv-label{font-size:.9rem; color:var(--muted)} .lv-label b{color:var(--gold); font-size:1.05rem}
.lv-bar input[type=range]{flex:1 1 10rem; accent-color:var(--gold); min-width:8rem}
.lv-quick{display:flex; gap:.3rem} .lv-quick .chip{padding:.2rem .55rem; font-size:.8rem}
.lv-quick .chip.on{color:var(--text); border-color:var(--gold-dim); background:var(--raised)}
/* ─ 시너지 계산기 ─ */
.syn-calc{margin:.7rem 0 .2rem; padding:.55rem .75rem; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px}
.syn-head{display:flex; align-items:center; gap:.4rem; margin-bottom:.3rem}
.syn-head h3{flex:1; margin:0; font-size:.88rem; font-weight:600; color:var(--muted)}
.syn-head .chip{padding:.22rem .55rem; font-size:.78rem}
.syn-row{display:flex; align-items:center; gap:.55rem; padding:.3rem 0}
.syn-row+.syn-row{border-top:1px solid var(--border-soft)}
.syn-row .sicon{width:2rem; height:2rem; border-radius:6px}
.syn-row .nm{flex:1; font-size:.92rem}
.stp{display:flex; align-items:center; gap:.2rem}
.stp button{width:2.1rem; height:2.1rem; border-radius:8px; border:1px solid var(--border);
  background:var(--raised); color:var(--text); font-size:1.1rem; line-height:1; cursor:pointer}
.stp button:active{background:var(--gold-dim)}
.stp b{min-width:1.7rem; text-align:center; color:var(--gold); font-size:1rem}
.syn-up{color:var(--gold); font-weight:600}
.syn-sum{margin:.4rem 0 0; font-size:.85rem; color:var(--gold)}
.syn-sum:empty{display:none}
.syn-calc .hint{margin:.35rem 0 0}
.aff-note{color:var(--muted); font-size:.85rem; background:var(--surface-2); border-radius:10px; padding:.6rem .8rem; margin:.4rem 0 1rem}
/* ─ 오라 사전 ─ */
.aura-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:10px}
.aura-card .row{background:none; border:none}
.aura-card .sub{display:block; white-space:normal; line-height:1.55; margin-top:.15rem}
.aura-card .sub b{color:var(--gold); font-weight:600}
.a-to{color:var(--faint)}
.aura-items{margin:0; padding:.45rem .65rem .55rem; border-top:1px solid var(--border-soft)}
.aura-items .chip{font-size:.78rem; padding:.24rem .55rem}
.a-lv{color:var(--gold-dim)}
.foot{color:var(--faint); font-size:.72rem; text-align:center; margin-top:2.5rem; line-height:1.7}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>

<header class="hdr">
  <button class="back" id="btnBack" hidden aria-label="뒤로">‹</button>
  <div class="hdr-title">
    <div class="t1" id="hdrT1">D2R 사전</div>
    <div class="t2 en" id="hdrT2">Diablo II: Resurrected</div>
  </div>
</header>
<main class="wrap" id="app"></main>

const fmtNum = v => (typeof v === "number") ? (Number.isInteger(v) ? String(v) : v.toFixed(1)) : String(v);
function sprintf(fmt, args){
  let i = 0;
  return fmt.replace(/%(\+?)(d|s|%)/g, (m, plus, t) => {
    if(t === "%") return "%";
    const v = args[i++]; if(v === undefined) return "";
    let txt = fmtNum(v);
    if(t === "d" && plus && !txt.startsWith("-")) txt = "+" + txt;
    return txt;
  });
}

function iconHtml(cls, id){
  const i = DATA[cls] ? DATA[cls].skills.findIndex(s => s.id===id) : -1;
  if(i < 0) return `<span class="sicon"></span>`;
  return `<span class="sicon" style="background-image:url('assets/skills/sheets/${cls}.png');background-position:${(i%6)*20}% ${Math.floor(i/6)*25}%"></span>`;
}

function doSearch(query){
  const out = document.getElementById("searchOut");
  const main = document.getElementById("homeMain");
  if(!query){ out.innerHTML=""; main.hidden=false; return; }
  main.hidden = true;
  const ql = norm(query);
  const hits = [];
  for(const c of CLASS_ORDER){
    for(const s of DATA[c].skills){
      if(matchName(ql, s.name_ko, s.name_ko_classic, s.name_en)) hits.push([c,s]);
      if(hits.length >= 30) break;
    }
  }
  const ihits = ITEMS.filter(e =>
    matchName(ql, e.name_ko, e.name_ko_classic, e.name_en,
              e.base.name_ko, e.base.name_ko_classic)).slice(0, 30);
  const shits = [];
  for(const s of SETS){
    if(matchName(ql, s.name_ko, s.name_ko_classic, s.name_en)) shits.push(["set", s]);
    for(const it of s.items)
      if(matchName(ql, it.name_ko, it.name_ko_classic, it.name_en)) shits.push(["item", it, s]);
  }
  const rhits = RWS.filter(r =>
    matchName(ql, r.name_ko, r.name_ko_classic, r.name_en) ||
    matchName(ql, ...r.runes.map(x=>x.name_ko))).slice(0, 20);
  let html = "";
  if(hits.length) html += `<div class="sec-label">스킬</div><ul class="rows">` +
    hits.map(([c,s]) => rowHtml(c,s,true)).join("") + `</ul>`;
  if(ihits.length) html += `<div class="sec-label">유니크 아이템</div><ul class="rows">` +
    ihits.map(itemRowHtml).join("") + `</ul>`;
  if(shits.length) html += `<div class="sec-label">세트</div><ul class="rows">` +
    shits.slice(0,20).map(([t,x,s]) => t==="set"
      ? `<li><button class="row" data-go="set-${x.id}"><span class="b"><span class="nm" style="color:#6fcf6f">${esc(x.name_ko)}</span><span class="sub">세트 (${x.item_count}부위)</span></span></button></li>`

  out.innerHTML = html || `<p class="empty">"${esc(query)}" 검색 결과가 없습니다</p>`;
}

function renderClass(cls){
  const d = DATA[cls]; if(!d) return renderHome();
  setHdr(d.class_name_ko, d.class_name_en, true);
  const pages = [1,2,3].map(p => {
    const first = d.skills.find(s => s.tree.page===p);

  });
  const cur = tabState[cls] || 1;
  $app.innerHTML = `<div class="view">
    <div class="tabs" role="tablist">${pages.map(t =>
      `<button class="tab${t.page===cur?" on":""}" role="tab" aria-selected="${t.page===cur}" data-tab="${t.page}">${esc(t.name)}</button>`).join("")}
    </div>
    <div id="treeBox"></div>
    <p class="tree-note">아이콘을 누르면 상세 정보 · 금색 선은 선행 스킬 연결</p>

    $app.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x===b));
    drawTree(cls, +b.dataset.tab);
  }));

function drawTree(cls, page){
  const d = DATA[cls];
  const skills = d.skills.filter(s => s.tree.page===page);
  const byId = Object.fromEntries(skills.map(s => [s.id, s]));
  // 선행스킬 연결선 (같은 트리 내)
  const CW = 100, CH = 100; // 셀 크기 (viewBox 단위)
  let lines = "";
  for(const s of skills){
    for(const p of s.prerequisites){
      const from = byId[p.id]; if(!from) continue;
      const x1=(from.position.col-0.5)*CW, y1=(from.position.row-0.5)*CH;
      const x2=(s.position.col-0.5)*CW, y2=(s.position.row-0.5)*CH;
      lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }
  }
  const nodes = skills.map(s => `
    <button class="node" style="--c:${s.position.col};--r:${s.position.row}" data-go="s-${cls}-${s.id}">
      ${iconHtml(cls,s.id)}
      <span class="nm">${esc(s.name_ko)}</span>
      <span class="rq">Lv ${s.required_level}</span>
    </button>`).join("");
  document.getElementById("treeBox").innerHTML = `<div class="tree">
    <svg class="links" viewBox="0 0 300 600" preserveAspectRatio="none">${lines}</svg>
    <div class="tree-grid">${nodes}</div>
  </div>`;
}

/* ── 시너지 계산기 ──
   시너지 문구 "스킬명: 레벨당 <스탯> +N%"를 해석해, 투자 레벨만큼 레벨별 수치 줄에 반영 */
const SYN_LINE = /^(.+?): 레벨당 (.+?) \+([\d.]+)%$/;
// 시너지 스탯이 어떤 수치 줄(fmt)에 어떻게 적용되는지. mult=기본값×(1+%), add=퍼센트 숫자에 합산. null=해당 없음
function synMode(stat, fmt, fmts){
  const label = fmt.split(":")[0].trim();
  const pct = /%\+?d%%/.test(fmt); // "+N%" 형태의 줄
  const dmgOf = e => label===e+" 피해" || label===e+" 폭발 피해";
  switch(stat){
    case "화염 피해": return dmgOf("화염") ? (pct?"add":"mult") : null;
    case "번개 피해": return dmgOf("번개") ? (pct?"add":"mult") : null;
    case "냉기 피해": return dmgOf("냉기") ? (pct?"add":"mult") : null;
    case "마법 피해": return dmgOf("마법") ? (pct?"add":"mult") : null;
    case "독 피해":   return dmgOf("독")   ? (pct?"add":"mult") : null;
    case "피해": {
      // 공격력(물리) 줄이 있으면 거기에만 (볼케이노: 물리/화염 시너지 분리),
      // 없으면 이 스킬의 피해 줄에 적용 (허리케인의 냉기 피해, 회오리 갑옷의 피해 흡수)
      if(label==="공격력") return pct?"add":"mult";
      if(fmts.some(f => f.split(":")[0].trim()==="공격력")) return null;
      if(/^(화염|냉기|번개|마법|독) 피해$/.test(label)) return "mult";
      if(fmt==="%d의 피해 흡수") return "mult";
      return null;
    }
    case "원소 피해": return pct && ["화염 피해","냉기 피해","번개 피해"].includes(label) ? "add" : null;
    case "빙결 지속시간": return fmt.includes("동안 빙결") ? "mult" : null;
    case "지속시간": return (label==="지속시간"||label==="기절 지속시간") ? "mult" : null;
    case "초당 평균 마법 피해": return label==="마법 피해" ? "mult" : null;
    case "생명력": return label==="생명력" ? (pct?"add":"mult") : null;
    case "생명력 치유": return label==="치유" ? "mult" : null;
    case "명중률": return label==="명중률" ? (pct?"add":"mult") : null;
    case "방어력": return label==="방어력" ? (pct?"add":"mult") : null;
    case "확률": return fmt==="%d%% 확률" ? "add" : null;
    case "악마 속박 확률": return label==="속박 확률" ? "add" : null;
    case "분출 확률": return label==="분출 확률" ? "add" : null;
  }
  return null;
}
// 스킬의 시너지 소스 목록: [{name, effects:[{line, mode, pct, stat}]}] (계산 가능한 것만)
function synSources(s){
  if(s._synSrc) return s._synSrc;
  const t = s.tooltip, by = new Map(), un = [];
  if(t && t.synergies){
    const fmts = t.per_level.map(l => l.fmt);
    for(const line of t.synergies){
      const m = line.match(SYN_LINE); if(!m) continue;
      const [, name, stat, pctS] = m, pct = +pctS;
      const effects = [];
      fmts.forEach((f,i) => { const mode = synMode(stat, f, fmts); if(mode) effects.push({line:i, mode, pct, stat}); });
      if(!effects.length){ un.push(`${name}(${stat})`); continue; }
      if(!by.has(name)) by.set(name, {name, effects:[]});
      by.get(name).effects.push(...effects);
    }
  }
  s._synSrc = [...by.values()];
  s._synUn = [...new Set(un)];
  return s._synSrc;
}
// 현재 레벨 + 시너지 투자 상태로 수치 줄과 합계 다시 그리기
function updateTip(s){
  const t = s.tooltip, lv = s._lv||1, inv = s._syn||{};
  const lis = document.querySelectorAll("#tipLines li[data-fmt]");
  const mult = t.per_level.map(()=>0), add = t.per_level.map(()=>0);
  for(const src of synSources(s)){
    const n = inv[src.name]||0; if(!n) continue;
    for(const e of src.effects) (e.mode==="mult" ? mult : add)[e.line] += e.pct*n;
  }
  t.per_level.forEach((l,i) => {
    const li = lis[i]; if(!li) return;
    const base = l.v[lv-1];
    if(!mult[i] && !add[i]){ li.textContent = sprintf(l.fmt, base); return; }
    const vals = base.map(v => typeof v!=="number" ? v
      : mult[i] ? (Number.isInteger(v) ? Math.floor(v*(1+mult[i]/100)) : +(v*(1+mult[i]/100)).toFixed(1))
      : +(v + add[i]).toFixed(1));
    const j = l.fmt.indexOf(": ");
    li.innerHTML = `${esc(sprintf(l.fmt, base))} <span class="syn-up">▶ ${esc(sprintf(j>0 ? l.fmt.slice(j+2) : l.fmt, vals))}</span>`;
  });
  const sumEl = document.getElementById("synSum");
  if(sumEl){
    const sums = {};
    for(const src of synSources(s)){
      const n = inv[src.name]||0; if(!n) continue;
      const seen = new Set();
      for(const e of src.effects){ if(seen.has(e.stat)) continue; seen.add(e.stat); sums[e.stat]=(sums[e.stat]||0)+e.pct*n; }
    }
    const parts = Object.entries(sums).map(([k,v]) => `${k} +${+v.toFixed(1)}%`);
    sumEl.textContent = parts.length ? "시너지 합계: " + parts.join(" · ") : "";
  }
}
// 레벨별 수치 블록 (슬라이더 + 인게임 툴팁 문구 + 시너지 계산기)
function tooltipHtml(cls, s){
  const t = s.tooltip;
  if(!t || (!t.per_level.length && !t.static.length)) return "";
  const lv = s._lv || 1;
  const lines = t.per_level.map(l => `<li data-fmt="${esc(l.fmt)}">${esc(sprintf(l.fmt, l.v[lv-1]))}</li>`).join("");
  const stat = t.static.map(x => `<li class="base-stat">${esc(x)}</li>`).join("");
  const srcs = synSources(s);
  const inv = s._syn || (s._syn = {});
  const d = DATA[cls];
  const calc = srcs.length ? `<div class="syn-calc" id="synCalc">
      <div class="syn-head"><h3>시너지 투자</h3>
        <button class="chip plain" data-synall="20">모두 20</button>
        <button class="chip plain" data-synall="0">초기화</button></div>
      ${srcs.map((src,i) => {
        const ref = d.skills.find(x => x.name_ko===src.name);
        return `<div class="syn-row">${ref?iconHtml(cls,ref.id):""}<span class="nm">${esc(src.name)}</span>
          <span class="stp"><button data-si="${i}" data-d="-1" aria-label="${esc(src.name)} 감소">−</button><b>${inv[src.name]||0}</b><button data-si="${i}" data-d="1" aria-label="${esc(src.name)} 증가">＋</button></span></div>`;
      }).join("")}
      <p class="syn-sum" id="synSum"></p>
      ${s._synUn.length ? `<p class="hint">계산 미지원: ${s._synUn.map(esc).join(", ")}</p>` : ""}
    </div>` : "";
  return `<div class="d-sec" id="tipBox">
    <h2>레벨별 수치</h2>
    <div class="lv-bar">
      <span class="lv-label">레벨 <b id="lvNum">${lv}</b></span>
      <input type="range" id="lvSlider" min="1" max="20" value="${lv}" aria-label="스킬 레벨">
      <div class="lv-quick">${[1,5,10,15,20].map(n=>`<button class="chip plain${n===lv?" on":""}" data-lv="${n}">${n}</button>`).join("")}</div>
    </div>
    <ul class="props" id="tipLines">${lines}${stat}</ul>
    ${calc}
    <p class="hint">스킬 레벨과 시너지 투자만 반영한 수치 (숙련·장비 보너스 제외). 게임 툴팁과 같은 수식으로 계산.</p>
  </div>`;
}
function bindTooltip(s){
  const slider = document.getElementById("lvSlider"); if(!slider) return;
  const setLv = lv => {
    s._lv = lv; slider.value = lv;
    document.getElementById("lvNum").textContent = lv;
    document.querySelectorAll("#tipBox .lv-quick .chip").forEach(b => b.classList.toggle("on", +b.dataset.lv===lv));
    updateTip(s);
  };
  slider.addEventListener("input", () => setLv(+slider.value));
  document.querySelectorAll("#tipBox .lv-quick [data-lv]").forEach(b => b.addEventListener("click", () => setLv(+b.dataset.lv)));
  const calc = document.getElementById("synCalc");
  if(calc){
    const srcs = synSources(s), inv = s._syn;
    calc.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.synall !== undefined){
        const v = +b.dataset.synall;
        srcs.forEach(src => inv[src.name] = v);
        calc.querySelectorAll(".syn-row b").forEach(el => el.textContent = v);
      } else if(b.dataset.si !== undefined){
        const src = srcs[+b.dataset.si];
        const v = Math.max(0, Math.min(20, (inv[src.name]||0) + +b.dataset.d));
        inv[src.name] = v;
        b.parentElement.querySelector("b").textContent = v;
      } else return;
      updateTip(s);
    });
  }
  updateTip(s); // 이전에 입력해 둔 투자 상태 반영
}

const listState = {}; // 종류별 검색어/분류/등급 필터 유지
function renderItemList(kind){
  setHdr(`유니크 ${KIND_KO[kind]||""}`, "Unique Items", true);
  const list = ITEMS.filter(e => e.kind===kind);
  if(!list.length) return renderHome();
  const st = listState[kind] || (listState[kind] = {q:"", cat:"", tier:""});
  const cats = [];
  for(const e of list){ if(!cats.includes(e.category_ko)) cats.push(e.category_ko); }
  cats.sort((a,b)=>a.localeCompare(b,"ko"));
  const tiers = [["", "전체 등급"], ["normal","노멀"], ["exceptional","익셉셔널"], ["elite","엘리트"]];
  $app.innerHTML = `<div class="view">
    <input class="search" id="lq" type="search" placeholder="${KIND_KO[kind]} 이름 검색 (예: 바람살, 윈드포스, 활)" autocomplete="off" value="${esc(st.q)}">
    <div class="chips-bar" id="catChips">
      <button class="chip plain${st.cat===""?" on":""}" data-cat="">전체 (${list.length})</button>
      ${cats.map(c => `<button class="chip plain${st.cat===c?" on":""}" data-cat="${esc(c)}">${esc(c)} (${list.filter(e=>e.category_ko===c).length})</button>`).join("")}
    </div>
    <div class="chips-bar" id="tierChips">
      ${tiers.map(([v,l]) => `<button class="chip plain${st.tier===v?" on":""}" data-tier="${v}">${l}</button>`).join("")}
    </div>
    <div id="listOut"></div>
  </div>`;
  const draw = () => {
    const ql = norm(st.q);
    let rows = list.filter(e =>
      (!st.cat || e.category_ko===st.cat) && (!st.tier || e.tier===st.tier) &&
      (!ql || matchName(ql, e.name_ko, e.name_ko_classic, e.name_en, e.base.name_ko, e.base.name_ko_classic, e.category_ko)));
    const out = document.getElementById("listOut");
    if(!rows.length){ out.innerHTML = `<p class="empty">조건에 맞는 아이템이 없습니다</p>`; return; }
    let html = "";
    const groups = st.cat ? [st.cat] : cats.filter(c => rows.some(e => e.category_ko===c));
    for(const c of groups){
      const g = rows.filter(e => e.category_ko===c).sort((a,b)=>a.required_level-b.required_level);
      if(!g.length) continue;
      html += `<div class="cat-head">${esc(c)} <span style="color:var(--faint);font-weight:400">(${g.length})</span></div>
        <ul class="rows">${g.map(itemRowHtml).join("")}</ul>`;
    }
    out.innerHTML = html;
  };
  const q = document.getElementById("lq");
  q.addEventListener("input", () => { st.q = q.value.trim(); draw(); });
  document.getElementById("catChips").addEventListener("click", e => {

/* ── 오라 사전 ── */
function renderAuras(){
  setHdr("오라 사전", "Paladin & Item Auras", true);
  const d = DATA.paladin;
  // 아이템의 "장착 시 레벨 X 오라" 속성 수집 (유니크/룬워드/세트)
  const AURA_RE = /^장착 시 레벨 ([\d~]+) (.+) 오라$/;
  const src = {}; // 오라명 → [{lvl, label, go}]
  const scan = (arr, label, go) => (arr || []).forEach(p => {
    if(typeof p !== "string") return;
    const m = p.match(AURA_RE);
    if(m) (src[m[2]] = src[m[2]] || []).push({lvl: m[1], label, go});
  });
  ITEMS.forEach(e => scan(e.props_ko, e.name_ko, "i-" + e.id));
  RWS.forEach(r => scan(r.props_ko, r.name_ko + " (룬워드)", "r-" + r.id));
  SETS.forEach(s => {
    scan(s.partial_bonuses, s.name_ko + " 세트 효과", "set-" + s.id);
    scan(s.full_bonuses, s.name_ko + " 세트 효과", "set-" + s.id);
    s.items.forEach(it => { scan(it.props_ko, it.name_ko + " (세트)", "ti-" + it.id);
                            scan(it.set_bonuses, it.name_ko + " (세트)", "ti-" + it.id); });
  });
  const after = f => { const j = f.indexOf(": "); return j > 0 ? f.slice(j + 2) : f; };
  const row = s => {
    const t = s.tooltip;
    const lines = (t ? t.per_level : []).filter(l => !l.fmt.startsWith("마나 소모")).slice(0, 3)
      .map(l => `${esc(sprintf(l.fmt, l.v[0]))} <span class="a-to">→</span> <b>${esc(sprintf(after(l.fmt), l.v[19]))}</b>`);
    const alias = s.name_ko_classic ? ` <span class="en" style="color:var(--faint);font-size:.74rem">${esc(s.name_ko_classic)}</span>` : "";
    const items = (src[s.name_ko] || []).map(x =>
      `<li><button class="chip plain" data-go="${x.go}">${esc(x.label)} <span class="a-lv">Lv ${x.lvl}</span></button></li>`).join("");
    return `<li class="aura-card">
      <button class="row" data-go="s-paladin-${s.id}">
        ${iconHtml("paladin", s.id)}
        <span class="b"><span class="nm">${esc(s.name_ko)}${alias}</span>
        <span class="sub">${lines.join("<br>")}</span></span>
        <span class="lv">Lv ${s.required_level}</span>
      </button>
      ${items ? `<ul class="chips aura-items">${items}</ul>` : ""}
    </li>`;
  };
  const group = page => d.skills.filter(s => s.tree.page === page)
    .sort((a, b) => a.required_level - b.required_level || a.position.row - b.position.row)
    .map(row).join("");
  const treeName = page => d.skills.find(s => s.tree.page === page).tree.name_ko;
  $app.innerHTML = `<div class="view">
    <p class="aff-note">오라는 켜 두는 동안 자신과 파티(또는 주변 적)에게 지속 적용됩니다. 성기사 스킬이지만
      일부 아이템은 <b>장착만 해도</b> 해당 레벨의 오라가 발동됩니다 (아래 금색 표시).
      수치는 <b>1레벨 → 20레벨</b> 기준 — 오라를 누르면 레벨 슬라이더·시너지 계산기가 있는 상세로 이동합니다.</p>
    <div class="sec-label">${esc(treeName(2))} · Offensive Auras</div>
    <ul class="rows">${group(2)}</ul>
    <div class="sec-label" style="margin-top:1rem">${esc(treeName(3))} · Defensive Auras</div>
    <ul class="rows">${group(3)}</ul>
  </div>`;
}

/* ── 라우터 ── */
function route(){
  const h = location.hash.replace(/^#/,"");
  window.scrollTo(0,0);
  if(h.startsWith("c-")){
    renderClass(h.slice(2));
  } else if(h.startsWith("u-")){
    renderItemList(h.slice(2));
  } else if(h.startsWith("i-")){
    renderItem(h.slice(2));
  } else if(h === "sets"){
    renderSetList();
  } else if(h.startsWith("set-")){
    renderSet(h.slice(4));
  } else if(h.startsWith("ti-")){
    renderSetItem(h.slice(3));
  } else if(h === "rw"){
    renderRWList();
  } else if(h.startsWith("r-")){
    renderRW(h.slice(2));
  } else if(h === "charms"){
    renderCharms();
  } else if(h.startsWith("ca-")){
    renderCharmAffixes(h.slice(3));
  } else if(h === "cube"){
    renderCube();
  } else if(h === "auras"){
    renderAuras();
  } else if(h.startsWith("s-")){
    const rest = h.slice(2);
    const cls = CLASS_ORDER.find(c => rest.startsWith(c+"-"));
    if(cls) return renderSkill(cls, rest.slice(cls.length+1));
    renderHome();
  } else {
    renderHome();
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if(b){ location.hash = b.dataset.go; }
});
window.addEventListener("hashchange", route);
route();
</script>
